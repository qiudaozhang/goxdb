name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试：不需要数据库（internal/fakedb）
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "未格式化的文件:"; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go vet -tags integration ./tests/integration/...
      - run: go test -race ./...
      - name: benchmark module compiles
        working-directory: benchmark
        run: go vet ./...

  # 集成测试：单元测试通过后才跑，使用当前支持的最新版本。
  # 最低版本（MySQL 8.0 / PostgreSQL 14）在本地用 docker compose --profile legacy 验证。
  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: xdb
          MYSQL_DATABASE: xdb
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pxdb"
          --health-interval 2s
          --health-retries 90
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: xdb
          POSTGRES_DB: xdb
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 60
    env:
      XDB_REQUIRE_DB: "1" # 数据库不可达时失败而不是跳过
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration -race -count=1 ./tests/integration/...
